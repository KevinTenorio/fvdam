[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fvdam"
version = "0.1.0.dev0"
description = "Finite-Volume Direct Averaging Micromechanics (FVDAM) 2D homogenization in Python"
readme = "README.md"
license = "MIT"
authors = [{ name = "Kevin Tenório" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
